<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>語感邊境：台味守門員</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg: #f6f5f1;
      --surface: #ffffff;
      --surface-alt: #efede7;
      --text-main: #1f2421;
      --text-sub: #5f6662;
      --border: #dcd8ce;
      --accent: #2c4a3e;
      --accent-hover: #1e352c;
      --pass: #2e6f56;
      --pass-bg: #e8f3ee;
      --detain: #a64438;
      --detain-bg: #faecea;
      --gold: #a87b2d;
      --shadow: 0 8px 24px rgba(31, 36, 33, 0.06);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 頂部導覽列 */
    header {
      width: 100%;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
      cursor: pointer;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-ghost:hover {
      background: var(--surface-alt);
    }

    /* 主容器：嚴格流式排版，所有元件互不遮擋 */
    main {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 20px 60px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .view {
      display: none;
      flex-direction: column;
      gap: 22px;
      width: 100%;
      animation: fadeIn 0.25s ease;
    }

    .view.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 主頁大標題區 */
    .hero {
